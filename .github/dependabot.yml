# 依存関係と GitHub Actions の更新を週 1 回提案する。
# 公開直後の版を避けるため 7 日間のクールダウンを置く（サプライチェーン攻撃対策）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
    ignore:
      # @astrojs/check（型チェック）が TypeScript 7 に未対応のため、メジャー更新は提案させない。
      # @astrojs/check の peerDependencies が ^7 を含むようになったら、この設定を外す。
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
