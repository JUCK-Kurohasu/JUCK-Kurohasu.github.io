# GitHub Pages へのデプロイ
#
# 事前準備: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
# site / base は astro.config.mjs が GITHUB_REPOSITORY から自動で決める
#   - リポジトリ名が <user>.github.io → https://<user>.github.io/
#   - それ以外                     → https://<user>.github.io/<repo>/
#
# セキュリティ方針:
#   - サードパーティのアクションはコミット SHA で固定（タグの付け替えによるすり替え対策）
#   - トークンの権限はジョブごとに最小限、checkout の認証情報は残さない
#   - npm ci は .npmrc の ignore-scripts=true により install スクリプトを実行しない
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# デプロイは常に 1 つずつ（実行中のデプロイは中断しない）
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build (+ CSP verification)
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          # .well-known/security.txt を含めるため
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
